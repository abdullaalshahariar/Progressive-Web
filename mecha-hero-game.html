<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">


<style>
:root{
  --paper:#FFF7EA; --card:#FFFFFF; --ink:#26324E; --muted:#66708A;
  --fire:#E85D3D; --fire-soft:#FCE4DC;
  --aid:#1D9E75; --aid-soft:#DDF3EA;
  --quake:#DE9A18; --quake-soft:#FBEED2;
  --mist:#1B5E3B; --mist-soft:#E4F1E7;
  --good:#3B9B4E; --good-soft:#E2F3E5;
  --bad:#D6453D; --bad-soft:#FBE3E1;
  --line:#E8E0D0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,-apple-system,sans-serif;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:16px 16px 40px;min-height:100vh}
h1{font-size:32px;margin:8px 0 2px;letter-spacing:.5px}
h2{font-size:20px;margin:0 0 4px}
p{margin:6px 0}
.small{font-size:13px;color:var(--muted)}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:15px 18px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer;color:#fff;background:var(--ink);margin-top:10px}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn:active{transform:scale(.98)}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.back{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:7px 13px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.tag{margin-left:auto;font-size:13px;font-weight:700;color:var(--muted)}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 3px 0 rgba(38,50,78,.06)}
.modcard{display:flex;align-items:center;gap:14px;cursor:pointer}
.modcard .ic{font-size:38px;width:64px;height:64px;display:flex;align-items:center;justify-content:center;border-radius:18px;flex-shrink:0}
.modcard .go{margin-left:auto;font-size:22px;color:var(--muted)}
.stars{letter-spacing:2px;font-size:14px}
.stage{border-radius:18px;padding:18px 12px;text-align:center;margin:12px 0;overflow:hidden}
.stage .big{font-size:56px;display:inline-block;margin:0 6px}
.stage .med{font-size:36px;display:inline-block;margin:0 4px}
.chiprow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chip{background:rgba(255,255,255,.85);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink)}
.desk{width:150px;height:12px;background:#8a5a2b;border-radius:6px;margin:0 auto;position:relative}
.desk:before,.desk:after{content:"";position:absolute;top:12px;width:10px;height:44px;background:#8a5a2b;border-radius:4px}
.desk:before{left:8px}.desk:after{right:8px}
.under{font-size:38px;margin-top:2px}
.pointlist{list-style:none;padding:0;margin:8px 0 0}
.pointlist li{padding:9px 12px;background:var(--paper);border-radius:12px;margin-top:8px;font-size:15px}
.qtext{font-size:18px;font-weight:700;margin:14px 0 10px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:16px;font-family:inherit;color:var(--ink);margin-top:10px;cursor:pointer}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--bad-soft);border-color:var(--bad)}
.why{border-radius:14px;padding:12px 14px;margin-top:12px;font-size:15px}
.why.ok{background:var(--good-soft)}
.why.no{background:var(--bad-soft)}
.dots{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--ink)}
.dot.hit{background:var(--good)}
.dot.miss{background:var(--bad)}
.result{text-align:center;padding:26px 16px}
.result .trophy{font-size:70px}
.result .score{font-size:22px;font-weight:700;margin-top:6px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border:2px dashed var(--line);border-radius:999px;padding:8px 16px;font-weight:700;margin-top:12px}
.hero{text-align:center;padding:8px 0 2px}
.hero .logo{font-size:54px;display:inline-block}
.applogo{width:96px;height:96px;border-radius:24px;box-shadow:0 4px 0 rgba(38,50,78,.15)}
.banner{background:linear-gradient(90deg,var(--fire-soft),var(--quake-soft),var(--aid-soft));border-radius:18px;padding:12px;text-align:center;font-weight:700;margin-top:14px}
.passbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.pbtn{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 8px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer}
.pbtn.done{background:var(--good-soft);border-color:var(--good)}
.pbtn.next{border-color:var(--fire);color:var(--fire)}
.pbtn:disabled{opacity:.9}
.phint{border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px;font-weight:700;text-align:center;background:var(--paper)}
.contact{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px dashed var(--line)}
.contact:last-child{border-bottom:0}
.contact .ci{font-size:26px;width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:var(--paper);border-radius:12px;flex-shrink:0}
.contact .cn{font-weight:700;font-size:15px}
.contact .cd{font-size:12px;color:var(--muted)}
.contact .cp{margin-left:auto;text-align:right}
.contact .cp a{display:block;color:var(--mist);font-weight:700;text-decoration:none;font-size:15px;padding:2px 0}
.svgwrap{border-radius:18px;overflow:hidden;margin:12px 0}
#pin,#nozzle,#lever,#flames,#spray,#psmoke{transition:transform .7s ease,opacity .7s ease}
#nozzle{transform:rotate(-14deg)}
#spray{opacity:0}#psmoke{opacity:0}
.d1 #pin{transform:translate(-36px,-20px) rotate(-20deg);opacity:0}
.d2 #nozzle{transform:rotate(5deg)}
.d3 #lever{transform:rotate(5deg)}
.d3 #spray{opacity:1}
.d3 #flames{transform:scale(.72)}
.d4 #flames{transform:scale(.08);opacity:.08}
.d4 #psmoke{opacity:1}
@keyframes flick{0%,100%{transform:scale(1) rotate(-2deg)}50%{transform:scale(1.12) rotate(2deg)}}
@keyframes floaty{0%{transform:translateY(0);opacity:.9}100%{transform:translateY(-16px);opacity:.3}}
@keyframes crawl{0%{transform:translateX(-40px)}100%{transform:translateX(40px)}}
@keyframes shakebox{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes wrongshake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes drip{0%{transform:translateY(-6px);opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes spinny{to{transform:rotate(360deg)}}
@keyframes ants{to{stroke-dashoffset:-26}}
@keyframes pulseflag{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media (prefers-reduced-motion: no-preference){
  .fl{animation:flick .8s ease-in-out infinite}
  .fu{animation:floaty 2.2s ease-in-out infinite alternate}
  .cr{animation:crawl 2.6s ease-in-out infinite alternate}
  .shk{animation:shakebox .7s linear infinite}
  .opt.wrong,.pbtn.shake{animation:wrongshake .35s ease}
  .pop{animation:pop .45s ease}
  .dr{animation:drip 1.1s ease-in infinite}
  .gear{animation:spinny 7s linear infinite}
  .jet{animation:ants .5s linear infinite}
  .route{animation:ants .8s linear infinite}
  #fw1{animation:flick .7s ease-in-out infinite;transform-origin:504px 298px}
  .puff2{animation:floaty 2s ease-in-out infinite alternate}
  .grassflag{animation:pulseflag 1.6s ease-in-out infinite;transform-origin:center}
}
</style>
</head>


<script>
document.addEventListener("DOMContentLoaded", () => {

    // -------------------------
    // 1. SERVICE WORKER
    // -------------------------
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", async () => {
            try {
                const reg = await navigator.serviceWorker.register("./sw.js");
                console.log("Service Worker registered:", reg.scope);
            } catch (err) {
                console.error("SW registration failed:", err);
            }
        });
    }

    // -------------------------
    // 2. INSTALL PROMPT
    // -------------------------
    const installBtn = document.getElementById("installBtn");

    let deferredPrompt;

    window.addEventListener("beforeinstallprompt", (e) => {
        e.preventDefault();
        deferredPrompt = e;

        if (installBtn) {
            installBtn.hidden = false;
        }

        console.log("Install prompt ready");
    });

    if (installBtn) {
        installBtn.addEventListener("click", async () => {
            if (!deferredPrompt) return;

            deferredPrompt.prompt();
            await deferredPrompt.userChoice;

            deferredPrompt = null;
            installBtn.hidden = true;
        });
    }
});


</script>

try{ store = JSON.parse(localStorage.getItem("mechaHero")||"{}"); }catch(e){ store = {}; }

function stars(n){ let s=""; for(let i=0;i<3;i++) s += i < n ? "\u2B50" : "\u2606"; return s; }
function starCount(score,total){ const p=score/total; return p>=1?3:p>=0.8?2:p>=0.6?1:0; }

function homeScreen(){
  const total = Object.keys(MODULES).filter(k=>store[k] && store[k].badge).length;
  let cards = "";
  for(const k in MODULES){
    const m = MODULES[k];
    const b = store[k];
    cards += `<div class="card modcard" data-a="start" data-m="${k}">
      <div class="ic" style="background:${m.soft}">${m.icon}</div>
      <div><h2>${m.name}</h2>
      <div class="stars">${!b?"<span class='small'>Not played yet</span>":stars(starCount(b.best,b.total))+" <span class='small'>best "+b.best+"/"+b.total+"</span>"}</div></div>
      <div class="go">\u203A</div></div>`;
  }
  const heroBanner = total===3 ? `<div class="banner pop">\u{1F3C6} MECHA HERO! You earned all three badges!</div>` :
    `<div class="banner">\u{1F396}\uFE0F Badges collected: ${total} / 3</div>`;
  return `<div class="hero"><div><img class="applogo pop" src="${LOGO}" alt="Mecha Hero logo"></div>
    <h1>MEPA</h1>
    <p class="small"><b>Mechanical Evacuation Action Plan</b></p>
    <p class="small"><b>Dept. of Mechanical Engineering \u00B7 MIST</b><br>Master fire, first aid and earthquake safety \u2014 beat the quizzes to earn your badges!</p></div>
    ${heroBanner}${cards}
    <div class="card modcard" data-a="contacts">
      <div class="ic" style="background:var(--mist-soft)">\u{1F4DE}</div>
      <div><h2>Emergency contacts</h2><span class="small">MIST campus numbers \u2014 tap to call</span></div>
      <div class="go">\u203A</div></div>
    <p class="small" style="text-align:center;margin-top:18px">Fire at MIST? Call <b>Mirpur Fire Station 01901020764</b> \u00B7 National emergency <b>999</b></p>`;
}

    <div class="cp">${c.p.map(p=>`<a href="tel:${p}">${p}</a>`).join("")}</div>

      <b>\u{1F525} Fire?</b> Call <b>Mirpur Fire Station</b> first, then alert the Duty Officer.<br>
      <b>\u{1FA79} Injury?</b> Call the <b>MIST Medical Centre</b> or Medical Officer.<br>
      <b>\u{1F4CD} Assembly area:</b> green grass in front of Tower 1, Tower 2 and MIST field.
    </div>
    <p class="small" style="text-align:center">Tip: save these numbers in your phone today.</p>`;
}

function passCardHTML(){
  const btns = PASS_STEPS.map((s,i)=>{
    let cls = "pbtn";
    if(i < state.passStep) cls += " done";
    else if(i === state.passStep) cls += " next";
    const label = i < state.passStep ? "\u2705 " + s.k : s.k;
    return `<button class="${cls}" data-a="pstep" data-s="${i}" id="pb${i}">${label}</button>`;
  }).join("");
  const hint = state.passStep >= 4
    ? `<div class="phint" style="background:var(--good-soft)">\u{1F389} Fire's out! You've mastered PASS.</div>`
    : `<div class="phint" id="phint">Next: <b>${PASS_STEPS[state.passStep].k}</b></div>`;
  return `<div id="extwrap" class="${["","d1","d1 d2","d1 d2 d3","d1 d2 d3 d4"][state.passStep]}">${EXT_SVG}</div>
    <div class="passbtns">${btns}</div>${hint}
    ${state.passStep>=4?`<button class="btn ghost" data-a="preset">Try again \u21BB</button>`:""}`;
}

function learnScreen(){
  const m = MODULES[state.mod];
  const card = m.learn[state.idx];
  const last = state.idx === m.learn.length-1;
  let visual = "";
  if(card.type==="scene") visual = SCENES[card.scene];
  else if(card.type==="pass") visual = passCardHTML();
  else if(card.type==="map") visual = MAP_SVG;
  const nextDisabled = card.type==="pass" && state.passStep < 4;
  return `<div class="topbar"><button class="back" data-a="home">\u2039 Home</button>
    <span class="tag">${m.icon} Lesson ${state.idx+1} of ${m.learn.length}</span></div>
    <div class="card">
      <h2 style="color:${m.color}">${card.title}</h2>
      ${visual}
      <ul class="pointlist">${card.points.map(p=>`<li>${p}</li>`).join("")}</ul>
    </div>
    <button class="btn" style="background:${m.color};${nextDisabled?"opacity:.45":""}" ${nextDisabled?"disabled":""} data-a="${last?"quiz":"nextLearn"}">${nextDisabled?"Finish all 4 steps first \u{1F447}":(last?"Start the quiz \u{1F3AE}":"Next \u203A")}</button>`;
}

function quizScreen(){
  const m = MODULES[state.mod];
  const q = m.quiz[state.idx];
  const dots = m.quiz.map((_,i)=>{
    let c = "dot";
    if(i < state.results.length) c += state.results[i] ? " hit" : " miss";
    else if(i === state.idx) c += " on";
    return `<span class="${c}"></span>`;
  }).join("");
  return `<div class="topbar"><button class="back" data-a="home">\u2039 Home</button>
    <span class="tag">${m.icon} Question ${state.idx+1} of ${m.quiz.length}</span></div>
    <div class="dots">${dots}</div>
    <div class="card">
      <div class="qtext">${q.q}</div>
      ${q.o.map((o,i)=>`<button class="opt" data-a="ans" data-i="${i}">${o}</button>`).join("")}
      <div id="fb"></div>
    </div>
    <div id="nextwrap"></div>`;
}

function resultScreen(){
  const m = MODULES[state.mod];
  const sc = state.score, tot = m.quiz.length, st = starCount(sc,tot);
  const gotBadge = sc/tot >= 0.8;
  if(!store[state.mod]) store[state.mod] = {best:0, total:tot, badge:false};
  store[state.mod].total = tot;
  if(sc > store[state.mod].best) store[state.mod].best = sc;
  if(gotBadge) store[state.mod].badge = true;
  save();
  return `<div class="card result">
    <div class="trophy pop">${st===3?"\u{1F3C6}":gotBadge?"\u{1F389}":"\u{1F4AA}"}</div>
    <h2>${st===3?"Perfect!":gotBadge?"Great job!":"Good try!"}</h2>
    <div class="score">${sc} / ${tot} correct</div>
    <div class="stars" style="font-size:26px;margin-top:4px">${stars(st)}</div>
    ${gotBadge?`<div class="badge pop">${m.bicon} Badge earned: <span style="color:${m.color}">${m.badge}</span></div>`
      :`<p class="small">Score ${Math.ceil(tot*0.8)} or more to earn the <b>${m.badge}</b> badge. Review the lessons and try again!</p>`}
    <button class="btn" style="background:${m.color}" data-a="start" data-m="${state.mod}">Play again \u21BB</button>
    <button class="btn ghost" data-a="home">Back to home</button>
  </div>`;
}

function render(){
  const app = document.getElementById("app");
  if(state.screen==="home") app.innerHTML = homeScreen();
  else if(state.screen==="contacts") app.innerHTML = contactsScreen();
  else if(state.screen==="learn") app.innerHTML = learnScreen();
  else if(state.screen==="quiz") app.innerHTML = quizScreen();
  else app.innerHTML = resultScreen();
  window.scrollTo(0,0);
}

document.addEventListener("click", function(e){
  const el = e.target.closest("[data-a]");
  if(!el) return;
  const a = el.dataset.a;
  if(a==="home"){ state={screen:"home",mod:null,idx:0,score:0,answered:false,results:[],passStep:0}; render(); }
  else if(a==="contacts"){ state.screen="contacts"; render(); }
  else if(a==="start"){ state={screen:"learn",mod:el.dataset.m,idx:0,score:0,answered:false,results:[],passStep:0}; render(); }
  else if(a==="nextLearn"){ state.idx++; state.passStep = state.passStep>=4 ? 4 : state.passStep; render(); }
  else if(a==="quiz"){ state.screen="quiz"; state.idx=0; state.score=0; state.results=[]; render(); }
  else if(a==="ans"){ answer(parseInt(el.dataset.i,10)); }
  else if(a==="pstep"){ passTap(parseInt(el.dataset.s,10)); }
  else if(a==="preset"){ state.passStep=0; render(); }
  else if(a==="nextQ"){
    state.idx++;
    if(state.idx >= MODULES[state.mod].quiz.length){ state.screen="result"; }
    state.answered=false; render();
  }
});

function passTap(i){
  if(i === state.passStep && state.passStep < 4){
    state.passStep++;
    const wrap = document.getElementById("extwrap");
    wrap.className = ["","d1","d1 d2","d1 d2 d3","d1 d2 d3 d4"][state.passStep];
    render();
    const h = document.getElementById("phint");
    if(h && state.passStep < 4) h.innerHTML = "\u2705 " + PASS_STEPS[state.passStep-1].done + "<br>Next: <b>" + PASS_STEPS[state.passStep].k + "</b>";
  } else if(i > state.passStep){
    const b = document.getElementById("pb"+i);
    if(b){ b.classList.add("shake"); setTimeout(()=>b.classList.remove("shake"), 400); }
    const h = document.getElementById("phint");
    if(h) h.innerHTML = "\u26A0\uFE0F " + PASS_STEPS[state.passStep].hint;
  }
}

function answer(i){
  if(state.answered) return;
  state.answered = true;
  const m = MODULES[state.mod];
  const q = m.quiz[state.idx];
  const opts = document.querySelectorAll(".opt");
  const correct = i === q.a;
  if(correct) state.score++;
  state.results.push(correct);
  opts.forEach((o,idx)=>{
    if(idx===q.a) o.classList.add("right");
    else if(idx===i) o.classList.add("wrong");
    o.disabled = true;
  });
  document.getElementById("fb").innerHTML =
    `<div class="why ${correct?"ok":"no"}"><b>${correct?"\u2705 Correct!":"\u274C Not quite."}</b> ${q.why}</div>`;
  const last = state.idx === m.quiz.length-1;
  document.getElementById("nextwrap").innerHTML =
    `<button class="btn" style="background:${m.color}" data-a="nextQ">${last?"See my result \u{1F3C1}":"Next question \u203A"}</button>`;
}

render();
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  navigator.serviceWorker.register("./sw.js").catch(function(){});
}
</script>
</body>
</html>
